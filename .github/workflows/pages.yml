name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Point the static frontend at the deployed backend (repo variable API_BASE, no trailing slash).
      - name: Write runtime config
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          jq -n --arg api "$API_BASE" '"window.LOVE_CONFIG = { API_BASE: \($api | @json) };"' -r > frontend/config.js
          cat frontend/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
