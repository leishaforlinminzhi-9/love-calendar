<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF4EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17120E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CALENDAR">
  <title>CALENDAR</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="month-nav" role="group" aria-label="切换月份">
          <button class="icon-btn" id="prevMonth" aria-label="上个月">‹</button>
          <button class="icon-btn" id="nextMonth" aria-label="下个月">›</button>
        </div>
        <div class="top-actions">
          <button class="pill" id="todayBtn">今天</button>
          <button class="icon-btn round" id="settingsBtn" aria-label="设置">⚙︎</button>
        </div>
      </div>
      <h1 class="title">CALENDAR</h1>
      <p class="subtitle" id="monthLabel"></p>
    </header>

    <div class="banner" id="budgetBanner" role="alert" hidden></div>

    <main class="layout">
      <section class="card cal" aria-label="日历">
        <div class="grid dow" id="dow"></div>
        <div class="grid days" id="days"></div>
      </section>

      <aside class="side">
        <section class="card day" id="dayCard" aria-live="polite"></section>
        <section class="card stats" id="statsCard"></section>
      </aside>
    </main>

    <footer class="foot" id="foot">CALENDAR</footer>
  </div>

  <!-- Add / edit sheet -->
  <div class="backdrop" id="entrySheet" aria-hidden="true">
    <form class="sheet" id="entryForm" role="dialog" aria-modal="true" aria-labelledby="entryTitle" autocomplete="off">
      <div class="grabber"></div>
      <div class="sheet-head">
        <span class="icon big" id="previewIcon"></span>
        <div>
          <h2 id="entryTitle">新记录</h2>
          <p class="muted" id="entryDate"></p>
        </div>
      </div>

      <label class="field">
        <span class="label">内容</span>
        <textarea id="entryText" maxlength="60" rows="3" required></textarea>
        <span class="count" id="entryCount">0/60</span>
      </label>

      <div class="field">
        <span class="label">类型 <span class="muted" id="typeNote">自动识别</span></span>
        <div class="chips" id="typeChips" role="radiogroup" aria-label="类型"></div>
      </div>

      <div class="sheet-actions">
        <button type="submit" class="btn primary" id="saveBtn">保存</button>
        <button type="button" class="btn ghost" id="regenBtn" hidden>重新生成图标（消耗额度）</button>
        <div class="row">
          <button type="button" class="btn plain" id="cancelBtn">取消</button>
          <button type="button" class="btn plain danger" id="deleteBtn" hidden>删除</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Settings sheet -->
  <div class="backdrop" id="settingsSheet" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="grabber"></div>
      <h2 id="settingsTitle">设置</h2>

      <div class="group">
        <div class="group-row"><span>图像服务</span><span class="muted" id="apiStatus">检查中…</span></div>
        <div class="group-row"><span>已花费</span><span class="muted" id="spendStatus">—</span></div>
        <div class="group-row"><span>存储</span><span class="muted" id="storeStatus">—</span></div>
        <div class="group-row"><span>最近错误</span><span class="muted last-error" id="lastError">无</span></div>
        <label class="group-row">
          <span>访问口令</span>
          <input id="accessCode" type="password" placeholder="未设置则留空" autocomplete="off">
        </label>
      </div>

      <div class="group">
        <div class="group-row"><span>同步</span><span class="muted" id="syncStatus">等待同步</span></div>
        <button class="group-row action" id="syncNowBtn" type="button">立即同步</button>
        <button class="group-row action" id="forceBtn" type="button">强制刷新 · 清除错误缓存</button>
        <button class="group-row action" id="diagBtn" type="button">连接诊断</button>
        <pre class="diag" id="diagOut" hidden></pre>
        <button class="group-row action" id="diagCopyBtn" type="button" hidden>复制诊断结果</button>
        <button class="group-row action" id="lockBtn" type="button">锁定 · 清除本机口令</button>
      </div>

      <div class="group">
        <button class="group-row action" id="exportBtn" type="button">导出备份</button>
        <label class="group-row action">导入备份<input id="importFile" type="file" accept="application/json" hidden></label>
      </div>

      <div class="group">
        <button class="group-row action danger" id="clearBtn" type="button">清空全部记录（所有设备）</button>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn primary" id="settingsDone">完成</button>
      </div>
    </div>
  </div>

  <!-- Passcode gate: shown first when this device has no valid access code -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle" hidden>
    <form class="gate-card" id="gateForm" autocomplete="on">
      <h2 id="gateTitle">CALENDAR</h2>
      <p class="gate-msg" id="gateMsg">输入访问口令</p>
      <input id="gateCode" name="passcode" type="password" autocomplete="current-password" placeholder="访问口令" required>
      <label class="gate-remember"><input type="checkbox" id="gateRemember" checked> 在此设备上记住</label>
      <button type="submit" class="btn primary" id="gateBtn">进入</button>
      <button type="button" class="btn plain" id="gateSkip" hidden>先在本机使用</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
