# Cloudflare Workers deployment of the backend (free tier, never sleeps). The frontend stays on GitHub Pages.
# Deploy:  npx wrangler@4 login   then   npx wrangler@4 deploy
#
# Secrets are NOT stored here. Set each one once (it asks you to paste the value):
#   npx wrangler@4 secret put IMAGE_API_KEY
#   npx wrangler@4 secret put ACCESS_CODE
#   npx wrangler@4 secret put UPSTASH_REDIS_REST_URL
#   npx wrangler@4 secret put UPSTASH_REDIS_REST_TOKEN

name = "love-calendar-api"
main = "server/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true
# Deploys from git must not wipe settings added in the dashboard (secrets are never touched by a deploy anyway).
keep_vars = true

[vars]
IMAGE_API_BASE = "https://api.openai.com/v1"
IMAGE_MODEL = "gpt-image-2.5-flare"
# The browser origin allowed to call this API: your GitHub Pages site (scheme + host only, no path).
ALLOWED_ORIGINS = "https://leishaforlinminzhi-9.github.io"
# No passcode: anyone with the link sees and edits the same calendar. Set to "false" (and add an ACCESS_CODE secret) to lock it again.
OPEN_ACCESS = "true"
DAILY_LIMIT = "100"
BUDGET_WARN_USD = "50"

# Run the Worker in ONE fixed cloud region instead of next to each visitor. By default a visitor in, say, Hong Kong makes
# the Worker run in Hong Kong and call OpenAI from there, and OpenAI refuses calls from countries it does not serve
# ("Country, region, or territory not supported"). Pinning it to a supported region fixes that for every visitor.
[placement]
region = "aws:us-east-1"

# Keep a log of the requests the backend answers (time, path, status, country and data centre), shown in the dashboard
# under the Worker's "Observability" tab. Free plan: kept for a few days. Request bodies (the diary) are not logged.
[observability]
enabled = true
